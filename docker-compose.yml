services:
  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/taskdb
      SPRING_DATASOURCE_USERNAME: taskUser
      SPRING_DATASOURCE_PASSWORD: taskPassword
    depends_on:
      - database

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  database:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: taskdb
      POSTGRES_USER: taskUser
      POSTGRES_PASSWORD: taskPassword
    ports:
      - "5433:5432" # Changed host port to avoid conflicts
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
